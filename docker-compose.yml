version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: instructoplus_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: instructoplus_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:8000
        - VITE_RAZORPAY_KEY_ID=rzp_test_R6VMtQTtVSy3Pz
        - VITE_FIREBASE_APIKEY=AIzaSyD8JdpsS7-SuRPEMJ14TUHUrpSJSv7OuX0
    container_name: instructoplus_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
